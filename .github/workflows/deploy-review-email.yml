name: Deploy review email (Supabase)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Project ref de Supabase de gestiQa (Settings > General)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-review-email
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar autorización y proyecto de destino
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub Actions."
            exit 1
          fi
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::El project_ref no tiene un formato válido."
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar únicamente send-review-email
        run: supabase functions deploy send-review-email --project-ref "$PROJECT_REF" --no-verify-jwt
